spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/mylibrary

com:
  lisa:
    db:
      host: localhost
      port: 27017
      database: mylibrary


management:
  endpoints:
    web:
      exposure:
        include: mappings


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  override-with-generic-response: false
server.port: 8086
