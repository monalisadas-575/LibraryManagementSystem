spring:
  datasource:
    url: jdbc:mysql://localhost:3307/second_database
    username: my_user
    password: my_password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5675
    username: guest
    password: guest
    virtual-host: /
    ssl:
      enabled: false
    eager-initializer: true
  cloud:
    stream:
      bindings:
        createstudent-out-0:
          destination: mona.my-first-exchange
          contentType: application/json
          binder: rabbit
      rabbit:
        bindings:
          createstudent-out-0:
            producer:
              required-groups:
                - my-consumer-group
              declareExchange: true
              routing-key-expression: "'mona.student.key'"
              exchangeType: direct


management:
  endpoints:
    web:
      exposure:
        include: mappings


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  override-with-generic-response: false
server.port: 8086
